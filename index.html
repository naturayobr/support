<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Naturayo Support</title>
  <link rel="icon" href="logo.png" type="image/x-png">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      background: white;
      color: #3f2f24;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: #ffffff;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: #3f2f24;
      margin: 0 15px;
      text-decoration: none;
    }

    nav a.sublinhado {
      text-decoration: underline;
    }

    section {
      padding: 20px;
      flex: 1;
      text-align: center;
    }

    footer {
      background: #ecebea;
      color: #3f2f24;
      text-align: center;
      padding: 10px;
      width: 100%;
    }
  </style>
</head>
